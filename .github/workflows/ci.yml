name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos-arm64:
    # Primary platform. macos-15 runners are Apple Silicon.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Homebrew FFmpeg 9.x, wxWidgets 3.3.x)
        run: |
          brew update
          brew install autoconf automake libtool gettext pkgconf ffmpeg wxwidgets
          ffmpeg -version | head -1
          wx-config --version
      - name: Configure
        run: |
          # wxwin.m4 is not on aclocal's default path in Homebrew (see dist/osx/README.md).
          WXM4=$(dirname "$(find "$(brew --prefix wxwidgets)/" -name wxwin.m4 | head -1)")
          # Nor are gettext's macros (share/gettext/m4); without them translations are skipped.
          GTM4=$(dirname "$(find "$(brew --prefix gettext)/share/" -name gettext.m4 | head -1)")
          export ACLOCAL_PATH="$WXM4:$GTM4:$(brew --prefix)/share/aclocal"
          # Any use of a deprecated FFmpeg (or wx) API fails the build.
          ./autogen.sh --disable-valgrind CXXFLAGS="-g -O2 -Werror=deprecated-declarations"
      - run: make -j"$(sysctl -n hw.ncpu)"
      - run: make check || { cat tests/test-suite.log; exit 1; }
      - name: Bundle Spek.app and Spek.dmg
        run: ./dist/osx/bundle.sh --no-build
      - name: Check the bundle is native and self-contained
        run: |
          cd dist/osx
          EXE=Spek.app/Contents/MacOS/Spek
          lipo -archs "$EXE"
          [ "$(lipo -archs "$EXE")" = arm64 ]
          codesign --verify --deep --strict --verbose=2 Spek.app
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" Spek.app/Contents/Info.plist
          # Launch it and fail if dyld loads anything from Homebrew.
          DYLD_PRINT_LIBRARIES=1 "$EXE" --version 2> dyld.log
          if grep "$(brew --prefix)" dyld.log; then
            echo "Spek.app loads libraries from Homebrew" >&2
            exit 1
          fi
          echo "$(grep -c Frameworks dyld.log) libraries loaded from the bundle"
          hdiutil verify Spek.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Spek-macos-arm64
          path: dist/osx/Spek.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # n6.0.1 is the oldest FFmpeg configure accepts; distro = Ubuntu 24.04's FFmpeg 6.1.
        ffmpeg: [n6.0.1, distro, n7.1.5, n9.1]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool intltool gettext autopoint \
            pkg-config libwxgtk3.2-dev valgrind nasm
          if [ "${{ matrix.ffmpeg }}" = distro ]; then
            sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev
          fi
      - name: Cache FFmpeg build
        if: matrix.ffmpeg != 'distro'
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ matrix.ffmpeg }}-ubuntu-24.04-v1
      - name: Build FFmpeg from source (decoders/demuxers only)
        if: matrix.ffmpeg != 'distro' && steps.ffcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b ${{ matrix.ffmpeg }} https://github.com/FFmpeg/FFmpeg /tmp/ffsrc
          cd /tmp/ffsrc
          ./configure --prefix=$HOME/ffmpeg --enable-shared --disable-static \
            --disable-programs --disable-doc --disable-avdevice --disable-avfilter \
            --disable-swscale --disable-encoders --disable-muxers --disable-network
          make -j"$(nproc)" && make install
      - name: Point build at custom FFmpeg
        if: matrix.ffmpeg != 'distro'
        run: |
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/ffmpeg/lib" >> "$GITHUB_ENV"
      - run: ./autogen.sh CXXFLAGS="-g -O2 -Werror=deprecated-declarations"
      - run: make -j"$(nproc)"
      - run: make check || { cat tests/test-suite.log; exit 1; }   # runs under valgrind

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            autoconf automake libtool make gettext-devel intltool
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-wxwidgets3.2-msw
      - run: ./autogen.sh --disable-valgrind
      - run: make -j"$(nproc)"
      - run: make check || { cat tests/test-suite.log; exit 1; }

  corpus:
    # Rebuild the detector test corpus, check every label holds, and score the detectors.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-numpy autoconf automake libtool intltool \
            gettext autopoint pkg-config libwxgtk3.2-dev libavformat-dev libavcodec-dev libavutil-dev
          ffmpeg -version | head -1
      - run: tests/corpus/generate.py --out "$RUNNER_TEMP/corpus"
      - run: tests/corpus/verify.py "$RUNNER_TEMP/corpus" --report "$RUNNER_TEMP/corpus/verify.csv"
      - name: Build the analysis driver
        run: ./autogen.sh && make -j"$(nproc)" && make -C tests spek-analyze
      # Score the detectors. No false positives allowed, and the correct count
      # may only go up: raise --min-correct when a change improves it.
      - run: >
          tests/corpus/score.py "$RUNNER_TEMP/corpus" --report "$RUNNER_TEMP/corpus/score.csv"
          --max-false 0 --min-correct 57 --min-bitdepth-correct 70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-manifest
          path: |
            ${{ runner.temp }}/corpus/manifest.csv
            ${{ runner.temp }}/corpus/verify.csv
            ${{ runner.temp }}/corpus/score.csv
